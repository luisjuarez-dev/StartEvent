name: Revision de Codigo
run-name: ${{ github.sha }} Revisión de Código 
on: push
env:
  FLASK_ENV: Testing
jobs:
  RevisarCodigo:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Descargar el código fuente
        uses: actions/checkout@v6

      - name: Establecer versión de python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip' # Pone las dependencias en caché para ejecuciones posteriores más rápidas
        
      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Crear archivo .env en directorio específico
        run: |
          cat <<EOF > .env
          SQLALCHEMY_DATABASE_URI_PRUEBA=${{ secrets.SQLALCHEMY_DATABASE_URI_PRUEBA }}
          JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}
          PIMIENTA=${{ secrets.PIMIENTA_PRUEBA }}
          EOF
      
      - name: Revision completa
        run: | 
          echo "#########EMPEZANDO REVISION########"
          flask format --no-corregir --no-local
          echo "#########TERMINANDO REVISION########"
          