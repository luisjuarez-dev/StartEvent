name: Despliegue por SSH
on: 
  push: 
    branches: [master]
jobs:
  Desplegar:
    name: Despliegue
    runs-on: ubuntu-latest
    steps:
      - name: Execute remote SSH commands using password
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD_SSH }}
          port: ${{ secrets.PORT }}
          script: |
            cd StartEvent
            git pull
            sudo systemctl restart startevent
            echo "#####EMPEZANDO CON LOS LOG DEL SERVICIO####"
            sudo journalctl -u startevent.service -n 300 --no-pager