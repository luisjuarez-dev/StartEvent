name: Remote SSH Command
on: 
  push: 
    branches: [master]
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Execute remote SSH commands using password
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD_SSH }}
          port: ${{ secrets.PORT }}
          script: |
            cd StartEvent
            git pull
            sudo systemctl restart startevent
            ${{ secrets.PASSWORD_SSH }}
            sudo journalctl -u startevent.service -n 100 --no-pager