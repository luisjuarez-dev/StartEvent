name: Prueba Github Actions
on: push
env:
  FLASK_ENV: Testing
jobs:
  EjecutarTest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Descargar el código fuente
        uses: actions/checkout@v6

      - name: Establecer versión de python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip' # Automatically caches your dependencies to speed up future runs

      - name: Instalar dependencias
        run: pip install -r requirements.txt
      
      - name: Prueba ls 
        run: ls

      - name: Crear archivo .env en directorio específico
        run: |
          mkdir -p StartEvent
          cat <<EOF > StartEvent/.env
          SQLALCHEMY_DATABASE_URI_PRUEBA=${{ secrets.SQLALCHEMY_DATABASE_URI_PRUEBA }}
          JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}
          PIMIENTA_PRUEBA=${{ secrets.PIMIENTA_PRUEBA }}
          EOF

      - name: Prueba2 ls 
        run: ls